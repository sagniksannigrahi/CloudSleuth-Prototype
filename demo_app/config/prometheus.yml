global:
  scrape_interval: 5s        # 5-second readings, same as the simulator
  evaluation_interval: 5s
scrape_configs:
  - job_name: otel-collector  # service metrics (sent by the services via OTLP)
    static_configs:
      - targets: ["otel-collector:8889"]
  - job_name: postgres        # database stats from postgres-exporter
    static_configs:
      - targets: ["postgres-exporter:9187"]
