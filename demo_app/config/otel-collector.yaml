# OTel Collector: receives OTLP from the services and fans it out.
receivers:
  otlp:
    protocols:
      grpc: { endpoint: 0.0.0.0:4317 }
      http: { endpoint: 0.0.0.0:4318 }
processors:
  batch: { timeout: 1s }
exporters:
  otlp_grpc/jaeger:            # traces -> Jaeger
    endpoint: jaeger:4317
    tls: { insecure: true }
  prometheus:                  # metrics -> scraped by Prometheus
    endpoint: 0.0.0.0:8889
    metric_expiration: 20s     # a crashed service's metrics disappear quickly
  otlp_http/loki:              # logs -> Loki (native OTLP endpoint)
    endpoint: http://loki:3100/otlp
service:
  pipelines:
    traces:  { receivers: [otlp], processors: [batch], exporters: [otlp_grpc/jaeger] }
    metrics: { receivers: [otlp], processors: [batch], exporters: [prometheus] }
    logs:    { receivers: [otlp], processors: [batch], exporters: [otlp_http/loki] }
